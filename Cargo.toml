[package]
name = "bmp-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
modular-bitfield = "0.13.1"
strum = "0.28.0"
strum_macros = "0.28.0"
rand = "0.10.1"
rand_pcg = "0.10.2"
smallvec = { version = "1.15.2", features = ["const_generics"] }
flate2 = "1.1.9"
crc32fast = "1.5.0"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"

[dev-dependencies]
husky-rs = "0.3.3"
